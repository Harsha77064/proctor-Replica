# Production stack: Oversee app + Caddy (automatic HTTPS) + coturn (TURN relay).
# Configure everything in .env (copy .env.example). See DEPLOY.md.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      TRUST_PROXY: "1"
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
    volumes:
      - oversee-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking so the relay ports (UDP 49160-49200) are reachable directly.
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Never relay into private networks (protects the server's own network).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  oversee-data:
  caddy-data:
  caddy-config:
